<!DOCTYPE html>
<html lang="vi">
	<head>
		<meta charset="utf-8">
		<!-- No viewport-fit=cover: Safari keeps the page out of the notch / Dynamic
		     Island and the home-indicator area, so the game never draws under them. -->
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
		<meta name="theme-color" content="#060a12">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black">
		<meta name="apple-mobile-web-app-title" content="EMPIRE RUSH">
		<meta name="application-name" content="EMPIRE RUSH">
		<meta name="description" content="EMPIRE RUSH: cờ chiến thuật xây thành phố. Chơi offline với máy.">
		<title>EMPIRE RUSH</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html, body {
	width: 100%;
	height: 100%;
	background-color: #060a12;
	overscroll-behavior: none;
}

body {
	color: #f6f1e7;
	overflow: hidden;
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
	font-family: -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif;
}

#canvas {
	display: block;
	width: 100vw;
	height: 100vh;
	height: 100dvh;
}

#canvas:focus {
	outline: none;
}

#status {
	position: fixed;
	inset: 0;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 18px;
	background: radial-gradient(ellipse at 50% 38%, #24365c 0%, #121a2e 55%, #060a12 100%);
	z-index: 2;
	padding: 24px;
	box-sizing: border-box;
	text-align: center;
}

#status-logo {
	width: min(38vw, 180px);
	height: auto;
	border-radius: 22%;
	box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55), 0 0 0 2px rgba(245, 184, 61, 0.35);
}

#status-title {
	font-size: clamp(28px, 8vw, 44px);
	font-weight: 800;
	letter-spacing: 0.04em;
	color: #f5b83d;
	text-shadow: 0 3px 10px rgba(0, 0, 0, 0.5);
	margin: 0;
}

#status-text {
	font-size: 16px;
	color: rgba(246, 241, 231, 0.8);
	min-height: 1.4em;
	margin: 0;
}

#status-bar {
	width: min(72vw, 360px);
	height: 10px;
	border-radius: 6px;
	background: rgba(255, 255, 255, 0.1);
	overflow: hidden;
	box-shadow: inset 0 0 0 1px rgba(245, 184, 61, 0.35);
}

#status-bar-fill {
	width: 4%;
	height: 100%;
	background: linear-gradient(90deg, #b9821c, #f5b83d, #ffe29a);
	border-radius: 6px;
	transition: width 0.25s ease-out;
}

#status-notice {
	display: none;
	max-width: 420px;
	background: #2a1620;
	border: 1px solid #c4535f;
	border-radius: 14px;
	padding: 16px;
	line-height: 1.45;
	font-size: 15px;
}

#status-notice button, #install-hint button {
	margin-top: 12px;
	font: inherit;
	font-weight: 700;
	color: #1a1206;
	background: #f5b83d;
	border: 0;
	border-radius: 12px;
	padding: 12px 22px;
	min-height: 44px;
}

#install-hint {
	display: none;
	position: fixed;
	left: 12px;
	right: 12px;
	bottom: 14px;
	z-index: 3;
	background: rgba(18, 26, 46, 0.96);
	border: 1px solid rgba(245, 184, 61, 0.6);
	border-radius: 16px;
	padding: 14px 16px;
	font-size: 15px;
	line-height: 1.45;
	text-align: left;
	box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
}

#install-hint b {
	color: #f5b83d;
}

#install-hint button {
	margin-top: 8px;
	padding: 8px 16px;
	min-height: 40px;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Trình duyệt không hỗ trợ canvas.
		</canvas>

		<noscript>
			Cần bật JavaScript để chơi EMPIRE RUSH.
		</noscript>

		<div id="status">
			<img id="status-logo" src="index.icon.png" alt="">
			<p id="status-title">EMPIRE RUSH</p>
			<div id="status-bar"><div id="status-bar-fill"></div></div>
			<p id="status-text">Đang tải trò chơi…</p>
			<div id="status-notice"></div>
		</div>

		<div id="install-hint" role="dialog" aria-label="Thêm vào Màn hình chính">
			<b>Chơi như ứng dụng trên iPhone:</b> chạm nút <b>Chia sẻ</b>
			(ô vuông có mũi tên lên) ở thanh Safari, chọn <b>Thêm vào MH chính</b>,
			rồi mở game từ biểu tượng EMPIRE RUSH.<br>
			<button id="install-hint-close" type="button">Đã hiểu</button>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusText = document.getElementById('status-text');
	const statusBar = document.getElementById('status-bar');
	const statusFill = document.getElementById('status-bar-fill');
	const statusNotice = document.getElementById('status-notice');
	let initializing = true;

	// Pinch, double-tap zoom and rubber-band scrolling would move the game page.
	document.addEventListener('gesturestart', (e) => e.preventDefault(), { passive: false });
	document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });
	document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

	// iPhone/iPad Safari, not yet opened from the home screen: explain how to install.
	const ua = navigator.userAgent;
	const isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
	const standalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
	const hint = document.getElementById('install-hint');
	let hintDismissed = false;
	try {
		hintDismissed = window.localStorage.getItem('er_install_hint') === 'dismissed';
	} catch (e) { /* private mode: ignore */ }
	if (isIOS && !standalone && !hintDismissed) {
		hint.style.display = 'block';
	}
	document.getElementById('install-hint-close').addEventListener('click', () => {
		hint.style.display = 'none';
		try {
			window.localStorage.setItem('er_install_hint', 'dismissed');
		} catch (e) { /* ignore */ }
	});

	function showNotice(text) {
		console.error(text);
		statusBar.style.display = 'none';
		statusText.style.display = 'none';
		statusNotice.textContent = '';
		text.split('\n').forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
		const retry = document.createElement('button');
		retry.type = 'button';
		retry.textContent = 'Thử lại';
		retry.addEventListener('click', () => window.location.reload());
		statusNotice.appendChild(retry);
		statusNotice.style.display = 'block';
		initializing = false;
	}

	function failure(err) {
		const detail = (err instanceof Error) ? err.message : String(err || '');
		const offline = !navigator.onLine;
		showNotice((offline
			? 'Không tải được game: máy đang ngoại tuyến và game chưa được lưu sẵn trên máy.\nHãy kết nối mạng và mở lại một lần.'
			: 'Không tải được game.\nHãy kiểm tra kết nối mạng rồi thử lại.') + (detail ? '\n\nChi tiết: ' + detail : ''));
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		showNotice('Trình duyệt này thiếu tính năng cần để chạy game (' + missing.join(', ') + ').\n'
			+ 'Hãy dùng Safari (iOS 16.4 trở lên) hoặc Chrome/Edge bản mới.');
		return;
	}

	engine.startGame({
		'onProgress': function (current, total) {
			if (current > 0 && total > 0) {
				const pct = Math.min(100, Math.round((current / total) * 100));
				statusFill.style.width = Math.max(4, pct) + '%';
				statusText.textContent = 'Đang tải trò chơi… ' + pct + '%';
			} else {
				statusText.textContent = 'Đang tải trò chơi…';
			}
		},
	}).then(() => {
		statusOverlay.remove();
		initializing = false;
		window.__empireRushStarted = true;
	}, failure);

	// The engine registers the service worker itself once the game runs
	// (Engine.installServiceWorker): later launches load from its cache.
}());
		</script>
	</body>
</html>
