# Windows x64 playtest build (separate from tests.yml; does not change it).
#   build         (Linux)   export with the official 4.7.2 template, make
#                           EMPIRE_RUSH_Windows_Playtest_x64.zip (reproducible:
#                           same commit -> same bytes), privacy-scan it.
#   windows-run   (Windows) unzip the real ZIP into a path with Vietnamese
#                           letters and spaces, run THE EXPORTED .exe: full bot
#                           matches (2/3/4 players, one with reduced motion),
#                           a rendered launch with screenshots, and the Public
#                           Release build, which must write no telemetry.
#   windows-project (Windows) the project's own test suites (unit/integration,
#                           script compile, UI flows incl. menu, rapid taps,
#                           reduced motion) on the Windows Godot editor binary.
#   verify        (Linux)   replay every match recorded on Windows to the same
#                           final state hash, list which game flows happened,
#                           privacy-scan the Windows data.
# The ZIP to download is the artifact "EMPIRE_RUSH_Windows_Playtest_x64".
name: windows-playtest

on:
  push:
    branches: [claude/windows-playtest-build]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-playtest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      zip_sha256: ${{ steps.pkg.outputs.zip_sha256 }}
    steps:
      - uses: actions/checkout@v5

      - name: Cache Godot 4.7.2-stable
        uses: actions/cache@v5
        with:
          path: ~/.cache/godot/4.7.2-stable
          key: godot-4.7.2-stable-linux-x86_64-${{ hashFiles('scripts/ci/install_godot.sh') }}

      - name: Cache export templates (Linux + Windows release)
        uses: actions/cache@v5
        with:
          path: ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-templates-4.7.2-stable-linux-windows-release-${{ hashFiles('scripts/ci/install_templates.sh') }}

      - name: Install Godot and templates (SHA-512 verified)
        run: |
          echo "GODOT=$(scripts/ci/install_godot.sh | tail -n 1)" >> "$GITHUB_ENV"
          scripts/ci/install_templates.sh windows

      - name: Make the Windows playtest ZIP
        id: pkg
        run: |
          scripts/make_windows_playtest_package.sh
          echo "zip_sha256=$(cut -d' ' -f1 dist/EMPIRE_RUSH_Windows_Playtest_x64.zip.sha256)" >> "$GITHUB_OUTPUT"
          cat dist/windows-playtest/BUILD_INFO.txt
          cat dist/windows-playtest/SHA256SUMS.txt
          cat dist/EMPIRE_RUSH_Windows_Playtest_x64.zip.sha256

      - name: Export the Windows Public Release build (for the telemetry lock check)
        run: scripts/export_build.sh windows public release

      # What the owner downloads: the folder contents, zipped by GitHub.
      - name: Upload EMPIRE_RUSH_Windows_Playtest_x64
        uses: actions/upload-artifact@v6
        with:
          name: EMPIRE_RUSH_Windows_Playtest_x64
          path: dist/windows-playtest/
          retention-days: 30
          if-no-files-found: error

      # The exact ZIP file built above, so the Windows job tests that file.
      - name: Upload the ZIP file for the Windows test
        uses: actions/upload-artifact@v6
        with:
          name: windows-zip-under-test
          path: |
            dist/EMPIRE_RUSH_Windows_Playtest_x64.zip
            dist/EMPIRE_RUSH_Windows_Playtest_x64.zip.sha256
          retention-days: 7
          if-no-files-found: error

      - name: Upload the Public Release .exe
        uses: actions/upload-artifact@v6
        with:
          name: windows-public-exe
          path: build/windows-public/EmpireRush.exe
          retention-days: 3
          if-no-files-found: error

  windows-run:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: windows-zip-under-test
          path: ${{ runner.temp }}/zip

      - uses: actions/download-artifact@v5
        with:
          name: windows-public-exe
          path: ${{ runner.temp }}/public

      - name: Unzip into a path with Vietnamese letters and spaces, check sums
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "zip\EMPIRE_RUSH_Windows_Playtest_x64.zip"
          $want = (Get-Content (Join-Path $env:RUNNER_TEMP "zip\EMPIRE_RUSH_Windows_Playtest_x64.zip.sha256")).Split(" ")[0]
          $got = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $want) { throw "ZIP sha256 $got != $want" }
          $root = Join-Path $env:RUNNER_TEMP "Thử nghiệm Empire Rush\bản chơi thử"
          New-Item -ItemType Directory -Force $root | Out-Null
          Expand-Archive -Path $zip -DestinationPath $root -Force
          $game = Join-Path $root "EMPIRE_RUSH_Windows_Playtest_x64"
          Get-ChildItem -Recurse $game | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 300
          foreach ($line in Get-Content (Join-Path $game "SHA256SUMS.txt")) {
            $h, $f = $line -split "\s+", 2
            $actual = (Get-FileHash (Join-Path $game $f) -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $h) { throw "checksum mismatch: $f" }
          }
          "checksums OK"
          "GAME=$game" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "USERDATA=$env:APPDATA\Godot\app_userdata\Empire Rush" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Full bot matches with the exported .exe (2, 3, 4 players; reduced motion)
        run: |
          $exe = Join-Path $env:GAME "EmpireRush.exe"
          $out = Join-Path $env:RUNNER_TEMP "results"
          New-Item -ItemType Directory -Force "$out\logs" | Out-Null
          $runs = @(
            @{ name = "p4_s4";    args = "--players=4 --seed=4" },
            @{ name = "p4_s7";    args = "--players=4 --seed=7" },
            @{ name = "p3_s5";    args = "--players=3 --seed=5" },
            @{ name = "p2_s3_rm"; args = "--players=2 --seed=3 --reduced-motion" }
          )
          $failed = 0
          foreach ($r in $runs) {
            $a = "--headless -- $($r.args) --autoplay --timescale=10 --quit-on-end --telemetry=user://telemetry/win_$($r.name).json"
            $p = Start-Process -FilePath $exe -ArgumentList $a -PassThru -NoNewWindow `
                   -RedirectStandardOutput "$out\logs\$($r.name).out.txt" -RedirectStandardError "$out\logs\$($r.name).err.txt"
            if (-not $p.WaitForExit(900000)) { $p.Kill(); "TIMEOUT $($r.name)"; $failed++; continue }
            $tel = Join-Path $env:USERDATA "telemetry\win_$($r.name).json"
            $ok = Test-Path $tel
            "MATCH $($r.name) exit=$($p.ExitCode) telemetry=$ok"
            Get-Content "$out\logs\$($r.name).out.txt" | Select-String "TELEMETRY" | ForEach-Object { "  $_" }
            if (-not $ok -or $p.ExitCode -ne 0) { $failed++ }
          }
          if ($failed -gt 0) { throw "$failed match run(s) failed" }

      - name: Rendered launch (start menu) with screenshots
        continue-on-error: true
        run: |
          $exe = Join-Path $env:GAME "EmpireRush.exe"
          $shots = Join-Path $env:RUNNER_TEMP "results\shots"
          New-Item -ItemType Directory -Force $shots | Out-Null
          foreach ($drv in @("", "d3d12")) {
            $tag = if ($drv) { $drv } else { "default" }
            $a = @()
            if ($drv) { $a += "--rendering-driver", $drv }
            $a += "--", "--shots=$shots\$tag", "--shot-every=3"
            $p = Start-Process -FilePath $exe -ArgumentList $a -PassThru -NoNewWindow `
                   -RedirectStandardOutput "$env:RUNNER_TEMP\results\logs\launch_$tag.out.txt" -RedirectStandardError "$env:RUNNER_TEMP\results\logs\launch_$tag.err.txt"
            Start-Sleep -Seconds 25
            $alive = -not $p.HasExited
            if ($alive) { $p.Kill() }
            $n = (Get-ChildItem "$shots\$tag" -Filter *.png -ErrorAction SilentlyContinue | Measure-Object).Count
            "LAUNCH driver=$tag still_running_after_25s=$alive screenshots=$n"
            Get-Content "$env:RUNNER_TEMP\results\logs\launch_$tag.out.txt", "$env:RUNNER_TEMP\results\logs\launch_$tag.err.txt" -ErrorAction SilentlyContinue | Select-String "Vulkan|D3D12|Direct3D|OpenGL|ERROR|Device" | Select-Object -First 8 | ForEach-Object { "  $_" }
          }

      - name: Public Release writes no telemetry or device reports
        run: |
          $exe = Join-Path $env:RUNNER_TEMP "public\EmpireRush.exe"
          Remove-Item -Recurse -Force (Join-Path $env:USERDATA "telemetry_public_check") -ErrorAction SilentlyContinue
          $before = @(Get-ChildItem -Recurse -File (Join-Path $env:USERDATA "telemetry"), (Join-Path $env:USERDATA "device_validation") -ErrorAction SilentlyContinue).Count
          $a = "--headless -- --players=2 --seed=5 --autoplay --timescale=10 --quit-on-end --perf --devpanel --bench=1 --bench-quit --telemetry=user://telemetry/public_should_not_exist.json"
          $p = Start-Process -FilePath $exe -ArgumentList $a -PassThru -NoNewWindow -RedirectStandardOutput "$env:RUNNER_TEMP\results\logs\public.out.txt" -RedirectStandardError "$env:RUNNER_TEMP\results\logs\public.err.txt"
          if (-not $p.WaitForExit(900000)) { $p.Kill(); throw "public build timed out" }
          $after = @(Get-ChildItem -Recurse -File (Join-Path $env:USERDATA "telemetry"), (Join-Path $env:USERDATA "device_validation") -ErrorAction SilentlyContinue).Count
          "public build: exit=$($p.ExitCode) files before=$before after=$after"
          if ($after -ne $before) { throw "Public Release wrote telemetry/device files" }
          if (Test-Path (Join-Path $env:USERDATA "telemetry\public_should_not_exist.json")) { throw "public telemetry file exists" }
          "PUBLIC RELEASE LOCK OK on Windows"

      - name: Collect match records and logs
        if: always()
        run: |
          $out = Join-Path $env:RUNNER_TEMP "results"
          New-Item -ItemType Directory -Force "$out\telemetry", "$out\godot_logs" | Out-Null
          Copy-Item (Join-Path $env:USERDATA "telemetry\*") "$out\telemetry\" -ErrorAction SilentlyContinue
          Copy-Item (Join-Path $env:USERDATA "logs\*") "$out\godot_logs\" -ErrorAction SilentlyContinue
          "user data folder: $env:USERDATA"
          Get-ChildItem -Recurse $out | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 300

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: windows-run-results
          path: ${{ runner.temp }}/results/
          retention-days: 14

  windows-project:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - name: Install the Godot 4.7.2 Windows editor (SHA-512 verified)
        run: |
          $zip = "$env:RUNNER_TEMP\godot.zip"
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip" -OutFile $zip
          $sha = (Get-FileHash $zip -Algorithm SHA512).Hash.ToLower()
          if ($sha -ne "83decd58fdf67b9d657958a1ae6bf1929c20785315a81effe245874cdc57acb709bf868e00778a96984338c1b29dafdb453c6847747694621c6ecf5da2259993") { throw "SHA-512 mismatch $sha" }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\godot"
          "GODOT=$env:RUNNER_TEMP\godot\Godot_v4.7.2-stable_win64_console.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Unit/integration, script compile and UI suites on Windows
        run: |
          $client = Join-Path $env:GITHUB_WORKSPACE "client"
          New-Item -ItemType Directory -Force logs | Out-Null
          & $env:GODOT --headless --path $client --import *> logs\import.txt
          $fail = 0
          foreach ($s in @(@("unit", "res://tests/test_runner.gd"), @("scripts", "res://tests/check_scripts.gd"), @("ui", "res://tests/ui/ui_test_runner.gd"))) {
            & $env:GODOT --headless --path $client --script $s[1] *> "logs\$($s[0]).txt"
            $code = $LASTEXITCODE
            Select-String -Path "logs\$($s[0]).txt" -Pattern "DISCOVERED|RESULT|CHECKED|^FAIL" | ForEach-Object { $_.Line }
            if (Select-String -Path "logs\$($s[0]).txt" -Pattern "SCRIPT ERROR|Parse Error" -Quiet) { "script errors in $($s[0])"; $code = 1 }
            "$($s[0]) exit=$code"
            if ($code -ne 0) { $fail++ }
          }
          if ($fail -gt 0) { throw "$fail suite(s) failed on Windows" }

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: windows-project-test-logs
          path: logs/
          retention-days: 14

  verify:
    needs: windows-run
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Cache Godot 4.7.2-stable
        uses: actions/cache@v5
        with:
          path: ~/.cache/godot/4.7.2-stable
          key: godot-4.7.2-stable-linux-x86_64-${{ hashFiles('scripts/ci/install_godot.sh') }}

      - name: Install Godot
        run: echo "GODOT=$(scripts/ci/install_godot.sh | tail -n 1)" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v5
        with:
          name: windows-run-results
          path: win

      - name: Replay every Windows match on Linux; list the game flows that happened
        run: |
          "$GODOT" --headless --path client --import >/dev/null 2>&1 || true
          n=0; ok=0
          for f in win/telemetry/win_*.json; do
            n=$((n+1))
            "$GODOT" --headless --path client --script res://tools/replay_match.gd -- --file="$PWD/$f" --events=1 > "replay_$(basename "$f").txt" 2>&1 || true
            line="$(grep -E '^REPLAY ' "replay_$(basename "$f").txt" || echo 'REPLAY missing')"
            echo "$(basename "$f"): $line"
            grep -q "MATCHES the recorded final state" <<< "$line" && ok=$((ok+1))
          done
          echo "REPLAYS MATCH $ok/$n"
          if [ "$n" -lt 4 ] || [ "$ok" -ne "$n" ]; then echo "replay check failed"; exit 1; fi
          echo "== game flows in the Windows matches (event counts)"
          cat replay_*.txt | grep '^EV ' | grep -oE '"type":"[A-Za-z]+"' | sed 's/"type"://;s/"//g' | sort | uniq -c | sort -rn
          for need in PropertyBought RentCharged UpgradeBuilt EventCardDrawn ChoiceResolved MatchEnded; do
            cat replay_*.txt | grep -q "\"type\":\"$need\"" || { echo "missing flow: $need"; exit 1; }
          done
          for maybe in AuctionOpened RescueStarted PlayerBankrupt TradeProposed; do
            if cat replay_*.txt | grep -q "\"type\":\"$maybe\""; then echo "seen: $maybe"; else echo "not seen in these seeds: $maybe"; fi
          done

      - name: Privacy scan of the Windows match records
        run: |
          python3 scripts/analysis/privacy_scan.py win/telemetry
          echo "== engine logs (not shipped to testers; listed for information)"
          python3 scripts/analysis/privacy_scan.py win/godot_logs || true
