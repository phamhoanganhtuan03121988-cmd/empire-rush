# Web/PWA build for iPhone Safari (Add to Home Screen) and GitHub Pages.
#   1. web-build: exports the "Web Public Release" preset (single-threaded,
#      Compatibility/WebGL 2, PWA), then plays it in headless Chromium with an
#      iPhone-sized touch viewport (tests_web/e2e_web.mjs): boot, a real turn
#      with a purchase, names on the HUD, save + reload + resume, the service
#      worker and a reload with the network cut. This is NOT Safari/iOS.
#   2. deploy: publishes the tested build to GitHub Pages - only when Pages is
#      enabled for the repository (Settings > Pages > Source: GitHub Actions)
#      and this branch may deploy to the github-pages environment. Otherwise
#      the job explains what is missing and stays green.
# No secrets are used. See docs/WEB_PWA_DEPLOYMENT.md.
name: web-pwa

on:
  push:
    branches: [main, claude/empire-rush-web-pwa-launch]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-pwa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Cache Godot 4.7.2-stable
        uses: actions/cache@v5
        with:
          path: ~/.cache/godot/4.7.2-stable
          key: godot-4.7.2-stable-linux-x86_64-${{ hashFiles('scripts/ci/install_godot.sh') }}

      - name: Cache export templates (Linux + web)
        uses: actions/cache@v5
        with:
          path: ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-templates-4.7.2-stable-linux-web-${{ hashFiles('scripts/ci/install_templates.sh') }}

      - name: Install Godot and the web template (SHA-512 verified)
        run: |
          echo "GODOT=$(scripts/ci/install_godot.sh | tail -n 1)" >> "$GITHUB_ENV"
          scripts/ci/install_templates.sh web

      - name: Export the web build (PWA)
        run: scripts/export_build.sh web public

      - name: Install Playwright + Chromium (test only, not shipped)
        working-directory: tests_web
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      # Pixel ratio 1 on CI: the runner renders WebGL on its CPU, and a x3
      # canvas makes every frame (and so every step) several times slower.
      # The layout is the same 390x844 pt; x3 is run locally
      # (docs/IOS_WEB_TEST_REPORT.md).
      - name: Browser end-to-end test (Chromium, iPhone viewport, touch)
        env:
          E2E_DPR: "1"
        run: node tests_web/e2e_web.mjs build/web-public web-e2e

      - name: Responsive check (iPhone SE / 15 / 15 Pro Max / landscape / iPad mini)
        run: node tests_web/responsive_web.mjs build/web-public web-e2e/responsive

      - name: Screen tour with layout audit (intro, setup, tutorial, pause, rules, settings)
        run: node tests_web/ui_tour_web.mjs build/web-public web-e2e/tour

      - name: Upload e2e screenshots and results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: web-e2e
          path: web-e2e/
          if-no-files-found: warn

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web-public

  # Safari's engine (WebKit on Linux, iPhone 13 profile): boot, WebGL 2, the
  # AudioContext after a tap. Informative: it is not iOS Safari on a phone,
  # and Linux WebKit's WebGL can differ, so it does not block the deploy.
  webkit:
    needs: web-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Download the tested web build
        uses: actions/download-artifact@v5
        with:
          name: github-pages
          path: pages
      - name: Unpack
        run: mkdir -p build/web-public && tar -xf pages/artifact.tar -C build/web-public
      - name: Install Playwright + WebKit (test only)
        working-directory: tests_web
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps webkit
      - name: WebKit smoke test
        run: node tests_web/webkit_smoke.mjs build/web-public web-webkit
      - name: Upload WebKit results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: web-webkit
          path: web-webkit/
          if-no-files-found: warn

  # Deploys only (a) on a push to main or to the launch branch, or (b) when
  # run by hand (workflow_dispatch) on the launch branch or main. Never from
  # a pull_request event (forks / unreviewed code cannot publish).
  deploy:
    needs: web-build
    if: >-
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/empire-rush-web-pwa-launch')) ||
      (github.event_name == 'workflow_dispatch' &&
        (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/empire-rush-web-pwa-launch'))
    runs-on: ubuntu-24.04
    # One deployment at a time, and never cancel one half-way.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Is GitHub Pages enabled?
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Pages not enabled yet
        if: steps.pages.outcome != 'success'
        run: |
          {
            echo "### GitHub Pages is not enabled for this repository"
            echo "The web build passed its tests but was not published."
            echo "Settings > Pages > Build and deployment > Source: **GitHub Actions**, then re-run this workflow."
            echo "(GitHub Pages is free for public repositories.)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4

      - name: Link
        if: steps.pages.outcome == 'success'
        run: |
          echo "### Play: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"

      # Fetch the live site over HTTPS (from the runner) and check that it is
      # this build: the page, the PWA manifest, the service worker, the engine.
      - name: Verify the live site
        if: steps.pages.outcome == 'success'
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 18); do
            if curl -fsS "${URL}index.html" -o page.html && grep -q "<title>EMPIRE RUSH</title>" page.html; then ok=1; break; fi
            sleep 10
          done
          [ "$ok" = 1 ] || { echo "live page not reachable or not this game"; exit 1; }
          curl -fsS "${URL}index.manifest.json" | python3 -c "import json,sys; m=json.load(sys.stdin); assert m['name']=='EMPIRE RUSH' and m['display']=='standalone', m; print('manifest ok:', m['name'], m['display'])"
          curl -fsS "${URL}index.service.worker.js" | grep -q "CACHED_FILES" && echo "service worker ok"
          code=$(curl -sS -o /dev/null -w '%{http_code} %{content_type} %{size_download}' "${URL}index.wasm"); echo "index.wasm: $code"
          case "$code" in "200 application/wasm"*) ;; *) echo "index.wasm not served as application/wasm"; exit 1 ;; esac
          code=$(curl -sS -o /dev/null -w '%{http_code} %{size_download}' "${URL}index.pck"); echo "index.pck: $code"
          case "$code" in "200 "*) ;; *) exit 1 ;; esac
          echo "Verified live: ${URL} (page, manifest, service worker, engine, game data)" >> "$GITHUB_STEP_SUMMARY"
